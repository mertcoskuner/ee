# Ruff settings for project-owned code (see README.md).
line-length = 79
# Downloaded, hash-verified reference code must stay byte-for-byte intact.
extend-exclude = ["data"]

[lint]
# Classic Ruff defaults, pinned so newer releases do not change the rule
# set, plus pydocstyle so missing or malformed docstrings fail.
select = ["E4", "E7", "E9", "F", "D"]

[lint.pydocstyle]
convention = "pep257"
